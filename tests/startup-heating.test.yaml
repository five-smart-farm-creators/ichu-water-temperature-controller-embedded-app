# Change the simulated temperature before the first conversion; diagram.json still starts at 22 C.
name: Water controller startup heating qualification
version: 1
author: SmartFarm
steps:
  - set-control: { part-id: temp, name: temperature, value: 18 }
  - wait-serial: '[boot] ICHU water controller'
  - expect-pin: { part-id: esp, name: 26, value: 0 }
  - expect-pin: { part-id: relay, name: IN, value: 0 }
  - expect-pin: { part-id: relay, name: COM, value: 1 }
  - expect-pin: { part-id: heaterIndicator, name: A, value: 0 }
  - expect-pin: { part-id: heaterIndicator, name: C, value: 0 }
  - wait-serial: '[reading] seq=1 temp=18.00C heater=OFF state=QUALIFYING valid=1/3'
  - expect-pin: { part-id: esp, name: 26, value: 0 }
  - expect-pin: { part-id: heaterIndicator, name: A, value: 0 }
  - wait-serial: '[reading] seq=2 temp=18.00C heater=OFF state=QUALIFYING valid=2/3'
  - expect-pin: { part-id: esp, name: 26, value: 0 }
  - expect-pin: { part-id: heaterIndicator, name: A, value: 0 }
  - wait-serial: '[reading] seq=3 temp=18.00C heater=ON state=READY valid=3/3'
  - delay: 100ms
  - expect-pin: { part-id: esp, name: 26, value: 1 }
  - expect-pin: { part-id: relay, name: IN, value: 1 }
  - expect-pin: { part-id: relay, name: COM, value: 1 }
  - expect-pin: { part-id: relay, name: NO, value: 1 }
  - expect-pin: { part-id: heaterIndicator, name: A, value: 1 }
  - expect-pin: { part-id: heaterIndicator, name: C, value: 0 }
